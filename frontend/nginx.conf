upstream backend {
    server backend:5000;
}

server {
    listen 8080;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;

    # Serve SPA and static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Cache static assets (js, css, images) for 1 year
    location ~* ^/assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy backend API endpoints for auth and shared form data
    location ~ ^/(signup|login|logout|me|user) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_cookie_path / "/";
    }

    location ~ ^/api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_cookie_path / "/";
    }

    # SPA routing for client-side app routes
    location ^~ /share/ {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /forms/ {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /settings {
        try_files $uri $uri/ /index.html;
    }

    # SPA routing - fall back to index.html for any other paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
}
