services:
  # Frontend - React app served via Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shape-frontend
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - shape-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend - Flask API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shape-backend
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
    env_file:
      - ./config/.env.local
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - INSTANCE_DIR=/app/instance
      - DATABASE_URL=sqlite:////app/instance/users.db
    networks:
      - shape-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5000), timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  shape-network:
    driver: bridge
